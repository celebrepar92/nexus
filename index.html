<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus · Asistencia</title>
<link rel="icon" href="favicon.png" type="image/png">

<!-- El login es lo único que se necesita de inmediato; el resto carga en segundo plano -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
:root{
  --bg:#f5f5f4; --card:#fff; --fg:#18181b; --mut:#71717a; --bd:#e4e4e7; --soft:#fafafa;
  --acc:#18181b; --on:#fff; --ok:#059669; --bad:#dc2626; --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c0c0e; --card:#16161a; --fg:#f4f4f5; --mut:#a1a1aa; --bd:#27272a; --soft:#1c1c21; --acc:#f4f4f5; --on:#111;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:48px}

nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;letter-spacing:.12em;font-size:.95rem}
.netlify-identity-button{font-size:12px!important}

.wrap{max-width:460px;margin:20px auto;padding:0 14px;display:none;gap:14px;flex-direction:column}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}

h2{margin:0 0 12px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
label{display:block;margin:0 0 6px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.group{margin-bottom:14px}.group:last-child{margin-bottom:0}

input[type=text],input[type=date],textarea{
  width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--soft);
  color:var(--fg);font:inherit;font-size:14px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea{resize:vertical;min-height:64px}
input[type=file]{font-size:13px;color:var(--mut);width:100%}
.row{display:flex;gap:8px}.row>*{min-width:0}

/* Selectores segmentados */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:110px;padding:10px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--soft);
  color:var(--fg);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.seg button:active{transform:scale(.98)}

/* Estado de asistencia */
#statusBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:0;border-radius:12px;
  color:#fff;font:inherit;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  background:var(--mut);transition:.2s}
#statusBtn::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
#statusBtn[data-s=open]{background:var(--bad)}
#statusBtn[data-s=closed]{background:var(--ok)}
#statusBtn:disabled{opacity:.6;cursor:wait}

/* Poema */
.poem{margin-top:12px;padding:14px;border:1px dashed var(--bd);border-radius:12px;background:var(--soft);font-family:Georgia,"Times New Roman",serif}
.poem .t{font-weight:700;font-size:1.05rem;margin:0}
.poem .m{font-size:.78rem;color:var(--mut);font-style:italic;margin:2px 0 10px}
.poem .v{white-space:pre-wrap;font-size:.95rem;line-height:1.5}
.poem .c{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);font-size:.8rem;color:var(--mut);font-style:italic}
.poem .acot{font-style:italic;color:var(--mut);font-size:.88rem;margin:0 0 8px}
.poem .l{font-size:.95rem;line-height:1.45;margin:0 0 7px}
.poem .l b{font-size:.78rem;letter-spacing:.04em}
.poem .sk{color:var(--mut);font-style:italic;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
.poem img{width:100%;display:block;border-radius:6px;margin:0 0 10px}
.poem .tp{white-space:pre-wrap;font-size:.95rem;line-height:1.55}
.poem .tl{font-size:.92rem;line-height:1.45;margin:0 0 6px}
.poem .tl b{font-size:.74rem;letter-spacing:.04em;text-transform:uppercase}
.poem .er{color:var(--bad);font-size:.85rem}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 0;text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:600;color:var(--fg)}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.seg.tipos button{flex:1 1 0;min-width:92px;padding:8px 6px;font-size:13px}
.link{background:none;border:0;padding:0;margin-top:10px;color:var(--fg);font:inherit;font-size:.82rem;font-weight:600;text-decoration:underline;cursor:pointer}

.note{margin:8px 0 0;font-size:11.5px;color:var(--mut)}
#genBtn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
#genBtn:active{transform:scale(.99)}
#genBtn:disabled{opacity:.6;cursor:wait}
#msg{min-height:18px;margin:10px 0 0;font-size:12.5px;text-align:center;color:var(--mut)}
#msg.err{color:var(--bad)}
.hide{display:none!important}
</style>
</head>
<body>

<nav>
  <div class="brand">NEXUS</div>
  <div data-netlify-identity-button></div>
</nav>

<main id="panel" class="wrap">

  <section class="card">
    <button id="statusBtn" data-s="load" type="button">Cargando…</button>
  </section>

  <section class="card">
    <h2>PDF de asistencia</h2>

    <div class="group">
      <label>Comisión</label>
      <div class="seg" id="segCom"></div>
      <p class="note" id="waNote"></p>
    </div>

    <div class="group">
      <label for="dateInput">Fecha</label>
      <input type="date" id="dateInput" style="max-width:190px">
    </div>

    <div class="group">
      <label>Contenido de la hoja</label>
      <div class="seg" id="segMode">
        <button type="button" data-v="gen">Obra generada por IA</button>
        <button type="button" data-v="texto">Texto con IA</button>
        <button type="button" data-v="dibujo">Dibujo con IA</button>
        <button type="button" data-v="azar">Obra al azar</button>
        <button type="button" data-v="propia">Obra propia</button>
        <button type="button" data-v="solo">Solo QR</button>
      </div>

      <div id="pGen">
        <div class="poem" id="genBox"></div>
        <button class="link" id="genAgain" type="button">↻ Otra obra</button>
      </div>

      <div id="pTexto" class="hide" style="margin-top:12px">
        <div class="seg tipos" id="segTipo"></div>
        <input type="text" id="temaInput" maxlength="120" placeholder="Tema (opcional): el mar, la espera, la ciudad…" style="margin-top:10px">
        <label class="chk"><input type="checkbox" id="imgCheck"> Acompañar con una pintura que combine con el texto</label>
        <div class="poem" id="textoBox"></div>
        <button class="link" id="textoAgain" type="button">↻ Otro texto</button>
      </div>

      <div id="pDibujo" class="hide" style="margin-top:12px">
        <div class="seg tipos" id="segDib"></div>
        <input type="text" id="dibTema" maxlength="120" placeholder="Tema (opcional): el río, la espera, el taller…" style="margin-top:10px">
        <div class="poem" id="dibBox"></div>
        <button class="link" id="dibAgain" type="button">↻ Otro dibujo</button>
      </div>

      <p class="note hide" id="pAzar">Se elige una pintura de dominio público (Art Institute of Chicago o The Met), en blanco y negro.</p>

      <div id="pPropia" class="hide" style="margin-top:12px">
        <div class="group">
          <input type="file" id="fileInput" accept="image/*">
          <input type="text" id="customImgUrl" placeholder="…o pegá la URL de una imagen" style="margin-top:8px">
        </div>
        <div class="group">
          <input type="text" id="customTitle" placeholder="Título de la obra">
          <div class="row" style="margin-top:8px">
            <input type="text" id="customArtist" placeholder="Artista" style="flex:2">
            <input type="text" id="customYear" placeholder="Año" style="flex:1">
          </div>
        </div>
        <div class="group">
          <textarea id="customDescription" placeholder="Contexto breve (opcional): movimiento, técnica, motivo…"></textarea>
        </div>
      </div>
    </div>

    <button id="genBtn" type="button">Descargar PDF</button>
    <p id="msg"></p>
  </section>
</main>

<script>
/* ================== CONFIG ================== */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCz0xuSeFIHzZSUrKketDJPbPGUF4BGs2bVbCU2LcqgHFyQW-udbmE_l-UGLAHjfE7hQ/exec";
const AI_MODEL = "DeepSeek";
const PDF_TITLE = "Asistencia Taller Producción TFG";
// Para sumar el grupo de WhatsApp a otra comisión, completar "wa".
const COMISIONES = {
  inv: { nombre: "Investigación", url: "https://forms.gle/brSJRWUR3K5Khzvs5", wa: null },
  int: { nombre: "Intervención",  url: "https://forms.gle/5TKAKNPiqyU6ab8N8", wa: "https://chat.whatsapp.com/FDW8p8PIyfH7G6fwg9NqYt" }
};

/* ================== UTILIDADES ================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
// Tipos de texto que puede escribir la IA (el ID viaja a la función /.netlify/functions/texto)
const TIPOS = [
  ["haiku", "Haiku"], ["poema", "Poema largo"], ["soneto", "Soneto"], ["limerick", "Limerick"],
  ["microrrelato", "Microrrelato"], ["fabula", "Fábula"], ["aforismos", "Aforismos"],
  ["dialogo", "Diálogo filosófico"], ["sorpresa", "Sorpresa"]
];
const tipoNombre = id => (TIPOS.find(t => t[0] === id) || [0, "Texto"])[1];
// Tipos de dibujo SVG que puede hacer la IA (el ID viaja a /.netlify/functions/ilustracion)
const DIBUJOS = [["exlibris", "Ex libris"], ["constelacion", "Constelación"], ["planta", "Planta"], ["botanica", "Botánica"], ["emblema", "Emblema"], ["sorpresa", "Sorpresa"]];
const dibNombre = id => (DIBUJOS.find(t => t[0] === id) || [0, "Dibujo"])[1];
const state = { com: store.get("com", "inv"), mode: store.get("mode", "gen"), tipo: store.get("tipo", "haiku"), dib: null, dibP: null, dibTipo: store.get("dibtipo", "exlibris"),
  obra: null, obraP: null, texto: null, textoP: null, textoErr: "" };
if (!["gen","texto","dibujo","azar","propia","solo"].includes(state.mode)) state.mode = "gen";
if (!DIBUJOS.some(t => t[0] === state.dibTipo)) state.dibTipo = "exlibris";
if (!TIPOS.some(t => t[0] === state.tipo)) state.tipo = "haiku";
if (!COMISIONES[state.com]) state.com = "inv";

function setMsg(t, err) { const m = $("msg"); m.textContent = t || ""; m.className = err ? "err" : ""; }
function setBusy(b, label) { const g = $("genBtn"); g.disabled = b; g.textContent = b ? (label || "Procesando…") : "Descargar PDF"; }

function bindSeg(el, onPick) {
  el.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    onPick(b.dataset.v);
  });
}
function markSeg(el, v) { [...el.children].forEach(b => b.classList.toggle("on", b.dataset.v === v)); }

/* ================== AUTENTICACIÓN ================== */
netlifyIdentity.on("init", user => { if (user) activarPanel(); else netlifyIdentity.open(); });
netlifyIdentity.on("login", () => { netlifyIdentity.close(); activarPanel(); });
netlifyIdentity.on("logout", () => location.reload());

let panelListo = false;
function activarPanel() {
  $("panel").style.display = "flex";
  if (panelListo) return; panelListo = true;
  initUI();
  checkStatus();
  if (state.mode === "gen") loadObra().catch(() => {});
  if (state.mode === "texto") loadTexto().catch(() => {});
  if (state.mode === "dibujo") loadDibujo().catch(() => {});
}

/* ================== ESTADO DE ASISTENCIA ================== */
const statusBtn = $("statusBtn");
async function api(qs) {
  const r = await fetch(WEB_APP_URL + (qs || ""), { mode: "cors" });
  return r.json();
}
async function checkStatus() {
  statusBtn.dataset.s = "load"; statusBtn.textContent = "Consultando…";
  try { paintStatus((await api()).testMode); }
  catch (e) { statusBtn.dataset.s = "err"; statusBtn.textContent = "Sin conexión · tocar para reintentar"; }
}
statusBtn.addEventListener("click", async () => {
  if (statusBtn.disabled) return;
  if (statusBtn.dataset.s === "err") return checkStatus();
  statusBtn.disabled = true; statusBtn.textContent = "Procesando…";
  try { paintStatus((await api("?action=toggle")).testMode); }
  catch (e) { setMsg("No se pudo cambiar el estado.", true); checkStatus(); }
  finally { statusBtn.disabled = false; }
});
function paintStatus(open) {
  // true = asistencia activa (botón rojo para desactivar) | false = inactiva (botón verde para activar)
  statusBtn.dataset.s = open ? "open" : "closed";
  statusBtn.textContent = open ? "Desactivar asistencia" : "Activar asistencia";
}

/* ================== INTERFAZ ================== */
function initUI() {
  const segCom = $("segCom");
  Object.entries(COMISIONES).forEach(([k, c]) => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.v = k; b.textContent = c.nombre; segCom.appendChild(b);
  });
  const paintCom = () => {
    markSeg(segCom, state.com);
    $("waNote").textContent = COMISIONES[state.com].wa ? "Incluye al pie el QR del grupo de WhatsApp de la comisión." : "";
  };
  bindSeg(segCom, v => { state.com = v; store.set("com", v); paintCom(); });
  paintCom();

  const d = new Date(); $("dateInput").value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  const segMode = $("segMode");
  const paintMode = () => {
    markSeg(segMode, state.mode);
    $("pGen").classList.toggle("hide", state.mode !== "gen");
    $("pTexto").classList.toggle("hide", state.mode !== "texto");
    $("pDibujo").classList.toggle("hide", state.mode !== "dibujo");
    $("pAzar").classList.toggle("hide", state.mode !== "azar");
    $("pPropia").classList.toggle("hide", state.mode !== "propia");
  };
  bindSeg(segMode, v => {
    state.mode = v; store.set("mode", v); paintMode();
    if (v === "gen") loadObra().catch(() => {});
    if (v === "texto") loadTexto().catch(() => {});
    if (v === "dibujo") loadDibujo().catch(() => {});
  });
  paintMode();

  // Selector de tipo de texto + tema opcional
  const segTipo = $("segTipo");
  TIPOS.forEach(([id, nombre]) => { const b = document.createElement("button"); b.type = "button"; b.dataset.v = id; b.textContent = nombre; segTipo.appendChild(b); });
  markSeg(segTipo, state.tipo);
  bindSeg(segTipo, v => { state.tipo = v; store.set("tipo", v); markSeg(segTipo, v); loadTexto().catch(() => {}); });
  $("temaInput").addEventListener("change", () => loadTexto().catch(() => {}));
  $("imgCheck").checked = store.get("img", "0") === "1";
  $("imgCheck").addEventListener("change", () => { store.set("img", $("imgCheck").checked ? "1" : "0"); loadTexto().catch(() => {}); });

  // Selector de tipo de dibujo + tema opcional
  const segDib = $("segDib");
  DIBUJOS.forEach(([id, nombre]) => { const b = document.createElement("button"); b.type = "button"; b.dataset.v = id; b.textContent = nombre; segDib.appendChild(b); });
  markSeg(segDib, state.dibTipo);
  bindSeg(segDib, v => { state.dibTipo = v; store.set("dibtipo", v); markSeg(segDib, v); loadDibujo().catch(() => {}); });
  $("dibTema").addEventListener("change", () => loadDibujo().catch(() => {}));
  $("dibAgain").addEventListener("click", () => { if (state.dibP) return; state.dib = null; loadDibujo().catch(() => {}); });
  $("textoAgain").addEventListener("click", () => { if (state.textoP) return; state.texto = null; loadTexto().catch(() => {}); });

  $("genAgain").addEventListener("click", () => { if (state.obraP) return; state.obra = null; loadObra().catch(() => {}); });
  $("genBtn").addEventListener("click", generatePDF);
}

/* ================== OBRA GENERADA (plan: IA · pintura: algoritmo) ================== */
const LS = { gen: ["paisaje","marina","naturaleza_muerta","campos","vortice"], composicion: ["tercios","aurea","centrada","diagonal","triangular"],
  luz: ["izquierda","derecha","arriba"], clave: ["alta","media","baja"], pincelada: ["suave","empastada","fluida","fina"], formato: ["horizontal","vertical","cuadrado"] };
const GL = { paisaje:"Paisaje", marina:"Marina", naturaleza_muerta:"Naturaleza muerta", campos:"Campos de color", vortice:"Cielo en torbellino" };
const NOM = { paisaje:"un paisaje", marina:"una marina", naturaleza_muerta:"una naturaleza muerta", campos:"un campo de color", vortice:"un cielo en torbellino" };
const REF = { paisaje:["Turner","Corot","Friedrich","Constable"], marina:["Turner","Whistler","Boudin"], naturaleza_muerta:["Morandi","Chardin","Zurbarán","Cézanne"], campos:["Rothko","Newman","Reinhardt"], vortice:["Van Gogh","Munch","Kandinsky"] };
const pick = a => a[Math.floor(Math.random() * a.length)];
const num = (v, a, b) => { v = parseFloat(v); return isNaN(v) ? a + Math.random() * (b - a) : Math.max(a, Math.min(b, v)); };

// Valida el plan de la IA (o lo inventa localmente si falta): ningún valor inválido llega al pintor.
function normPlan(p) {
  p = p || {}; const o = {};
  [["genero","gen"],["composicion"],["luz"],["clave"],["pincelada"],["formato"]].forEach(([k, l]) => {
    const v = String(p[k] || "").toLowerCase().trim().replace(/ /g, "_"); o[k] = LS[l || k].includes(v) ? v : pick(LS[l || k]);
  });
  o.contraste = num(p.contraste, .2, 1); o.horizonte = num(p.horizonte, .28, .7); o.densidad = num(p.densidad, .15, 1); o.neblina = num(p.neblina, 0, .8);
  o.referencias = Array.isArray(p.referencias) && p.referencias.length ? p.referencias.slice(0, 3).map(s => String(s).slice(0, 30)) : [pick(REF[o.genero])];
  o.titulo = String(p.titulo || "").slice(0, 70) || "Sin título n.º " + (1 + Math.floor(Math.random() * 999));
  const mood = { alta: "una calma luminosa", media: "un equilibrio sereno", baja: "un clima grave y silencioso" }[o.clave];
  o.explicacion = String(p.explicacion || "").slice(0, 900) ||
    `Quise pintar ${NOM[o.genero]} con composición ${o.composicion}, de modo que el motivo principal guíe la mirada. La luz entra desde ${o.luz} y la escala tonal es de clave ${o.clave}, para lograr ${mood}. Trabajé con pincelada ${o.pincelada}, pensando en ${o.referencias.join(" y ")}.`;
  return o;
}

async function crearObra() {
  let plan = null, fuente = "algoritmo local";
  try {
    const user = netlifyIdentity.currentUser(), token = await user.jwt();
    const r = await fetch("/.netlify/functions/obra?n=" + Date.now(), { headers: { Authorization: "Bearer " + token }, signal: AbortSignal.timeout(25000) });
    if (r.ok) { plan = await r.json(); fuente = AI_MODEL; }
  } catch (e) {}
  plan = normPlan(plan);
  return Object.assign({ plan, fuente }, pintar(plan));
}
function loadObra() {
  if (state.obra) return Promise.resolve(state.obra);
  if (state.obraP) return state.obraP;
  state.obraP = crearObra().then(o => (state.obra = o)).finally(() => { state.obraP = null; renderObra(); });
  renderObra();
  return state.obraP;
}
function renderObra() {
  const box = $("genBox"); box.textContent = "";
  const add = (cls, t) => { const e = document.createElement("div"); e.className = cls; e.textContent = t; box.appendChild(e); };
  if (state.obraP) return add("sk", "La IA está concibiendo una obra…");
  const o = state.obra; if (!o) return;
  const im = new Image(); im.src = o.data; box.appendChild(im);
  add("t", o.plan.titulo);
  add("m", `${GL[o.plan.genero]} · ${o.plan.referencias.join(", ")} · ${o.fuente}`);
  add("l", o.plan.explicacion);
  if (o.fuente !== AI_MODEL) add("c", "DeepSeek no respondió: el plan y la explicación los generó el algoritmo local.");
}

/* Pintor. Semilla de 128 bits desde crypto: 2^128 obras posibles, repetir una es estadísticamente imposible.
   Todo se dibuja en grises; al final se agrega pincelada, grano y viñeta. */
function pintar(P) {
  const s4 = new Uint32Array(4); crypto.getRandomValues(s4);
  const id = [...s4].map(n => n.toString(16).padStart(8, "0")).join("").toUpperCase();
  let [a, b, c, d] = s4;
  const r = () => { let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0; return (t >>> 0) / 4294967296; };
  for (let i = 0; i < 20; i++) r();
  const W = 900, H = Math.round(W * { horizontal: .68 + r() * .1, vertical: 1.25 + r() * .15, cuadrado: 1 }[P.formato]);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d", { willReadFrequently: true });
  const K = { alta: .14, media: 0, baja: -.16 }[P.clave], C = .8 + P.contraste * .9;

    const a = ((await r.json()).data || [])[0];

    const desc = stripHtml(a.description) || [a.style_title, a.medium_display].filter(Boolean).join(" — ");
    return { title: a.title, artist: a.artist_title || "Desconocido", date: a.date_display || "s/f", desc, src: `https://www.artic.edu/iiif/2/${a.image_id}/full/800,/0/default.jpg` };
  }
  throw new Error("AIC sin resultados");
}
let metIds = null;
async function fetchMet() {
  if (!metIds) {
    const r = await tfetch("https://collectionapi.metmuseum.org/public/collection/v1/search?isHighlight=true&hasImages=true&q=painting");
    metIds = (await r.json()).objectIDs || [];
  }
  for (let i = 0; i < 4; i++) {
    const id = metIds[Math.floor(Math.random() * metIds.length)];
    const a = await (await tfetch("https://collectionapi.metmuseum.org/public/collection/v1/objects/" + id)).json();
    const src = a.primaryImageSmall || a.primaryImage; if (!src) continue;
    return { title: a.title, artist: a.artistDisplayName || "Desconocido", date: a.objectDate || "s/f",
      desc: [a.culture, a.period, a.medium, a.creditLine].filter(Boolean).join(" — "), src };
  }
  throw new Error("Met sin resultados");
}
async function getRandomArt() {
  const order = Math.random() > 0.5 ? [fetchAIC, fetchMet] : [fetchMet, fetchAIC];
  let art;
  try { art = await order[0](); } catch (e) { art = await order[1](); }
  art.title = await translateTitle(art.title);
  return art;
}
function getFileData(f) { return new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(f); }); }
async function getOwnArt() {
  const f = $("fileInput").files[0], u = $("customImgUrl").value.trim();
  const src = f ? await getFileData(f) : u;
  if (!src) return null;
  return { title: $("customTitle").value.trim() || "Sin título", artist: $("customArtist").value.trim() || "Desconocido",
    date: $("customYear").value.trim() || "s/f", desc: $("customDescription").value.trim(), src };
}
// Escala de grises + contraste, calculado a mano (ctx.filter no existe en Safari). Imagen liviana: 900px máx.
function processImg(src) {
  return new Promise(res => {
    const img = new Image();
    if (/^https?:/.test(src)) img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const W = Math.min(900, img.naturalWidth), H = Math.round(img.naturalHeight * W / img.naturalWidth);
        const c = document.createElement("canvas"); c.width = W; c.height = H;
        const x = c.getContext("2d", { willReadFrequently: true });
        x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0, W, H);
        const d = x.getImageData(0, 0, W, H), p = d.data;
        for (let i = 0; i < p.length; i += 4) {
          let g = .299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2];
          g = ((g - 128) * 1.2 + 128) * 1.05; g = g < 0 ? 0 : g > 255 ? 255 : g;
          p[i] = p[i + 1] = p[i + 2] = g;
        }
        x.putImageData(d, 0, 0);
        res({ data: c.toDataURL("image/jpeg", .75), ratio: H / W });
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = src;
  });
}

/* ================== DIBUJO DEL PDF ================== */
// ==PDF-START==
// jsPDF (fuentes estándar) solo soporta Latin-1 y algunos signos; se filtra el resto para que no salgan símbolos rotos.
const safe = s => String(s == null ? "" : s).normalize("NFC").replace(/\r/g, "").replace(/[^\n\x20-\x7E -ÿ–—‘’“”…]/g, "");
const one = (doc, s, w) => doc.splitTextToSize(s, w)[0] || "";

// QR vectorial: nítido a cualquier tamaño, sin imágenes pesadas y sin esperas.
function drawQR(doc, text, x, y, size) {
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), q = 4, cell = size / (n + q * 2);
  doc.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) doc.rect(x + (c + q) * cell, y + (r + q) * cell, cell + .04, cell + .04, "F");
  doc.link(x, y, size, size, { url: text });
}

function drawHeader(doc, comNombre, dateStr) {
  doc.setTextColor(0); doc.setFont("courier", "bold"); doc.setFontSize(20);
  doc.text(PDF_TITLE.toUpperCase(), 15, 21);
  doc.setFontSize(13);
  doc.text(`Comisión ${comNombre} — ${dateStr}`, 15, 29);
  doc.setLineWidth(.5); doc.line(15, 33, 195, 33);
}

function drawAttendanceQR(doc, url, genStr) {
  drawQR(doc, url, 72, 37, 66);
  doc.setFont("courier", "bold"); doc.setFontSize(9);
  doc.text("ESCANEÁ PARA REGISTRAR TU ASISTENCIA", 105, 108, { align: "center" });
  doc.setFont("courier", "normal"); doc.setFontSize(7);
  doc.text(url, 105, 113, { align: "center" });
  doc.setFontSize(7.5);
  doc.text(genStr, 105, 118, { align: "center" });
  doc.setLineWidth(.3); doc.line(40, 122, 170, 122);
}

// Versión compacta: QR a la izquierda y texto a la derecha, para dejar más lugar al contenido
function drawAttendanceQRCompact(doc, url, genStr) {
  drawQR(doc, url, 15, 35, 42);
  doc.setTextColor(0);
  doc.setFont("courier", "bold"); doc.setFontSize(12);
  doc.text("ESCANEÁ EL QR PARA", 62, 50);
  doc.text("REGISTRAR TU ASISTENCIA", 62, 56);
  doc.setFont("courier", "normal"); doc.setFontSize(7.5);
  doc.text(doc.splitTextToSize(url, 130), 62, 63);
  doc.text(genStr, 62, 69);
  doc.setLineWidth(.3); doc.line(15, 80, 195, 80);
}

function drawWA(doc, url, comNombre) {
  doc.setLineWidth(.3); doc.line(15, 251, 195, 251);
  drawQR(doc, url, 15, 254, 32);
  doc.setTextColor(0);
  doc.setFont("courier", "bold"); doc.setFontSize(10);
  doc.text("GRUPO DE WHATSAPP · " + comNombre.toUpperCase(), 52, 266);
  doc.setFont("courier", "normal"); doc.setFontSize(8.5);
  doc.text(doc.splitTextToSize("Escaneá el QR para sumarte al grupo de integrantes de la comisión.", 140), 52, 272);
  doc.setFontSize(7);
  doc.textWithLink(url.replace("https://", ""), 52, 281, { url });
}

// Obra de arte: imagen + título + artista + contexto
function drawArt(doc, a, top, bottom) {
  doc.setFont("courier", "bold"); doc.setFontSize(12);
  const tl = doc.splitTextToSize(safe(a.title).toUpperCase(), 170).slice(0, 2);
  doc.setFont("courier", "normal"); doc.setFontSize(8);
  const dl = a.desc ? doc.splitTextToSize(safe(a.desc), 160).slice(0, 4) : [];
  const textH = 6 + tl.length * 5.5 + 6 + dl.length * 4 + 2;
  const maxH = Math.min(bottom - top - textH, 150), maxW = 175;
  let h = maxH, w = h / a.img.ratio; if (w > maxW) { w = maxW; h = w * a.img.ratio; }
  doc.addImage(a.img.data, "JPEG", (210 - w) / 2, top, w, h);
  let y = top + h + 7;
  doc.setFont("courier", "bold"); doc.setFontSize(12);
  tl.forEach(l => { doc.text(l, 105, y, { align: "center" }); y += 5.5; });
  doc.setFont("courier", "normal"); doc.setFontSize(9);
  doc.text(one(doc, `ARTISTA: ${safe(a.artist).toUpperCase()} | AÑO: ${safe(a.date)}`, 180), 105, y + .5, { align: "center" }); y += 6.5;
  doc.setFontSize(8);
  dl.forEach(l => { doc.text(l, 105, y, { align: "center" }); y += 4; });
}

// Obra generada: imagen + título + ficha + explicación de la IA (o del algoritmo local si la IA no respondió)
function drawGen(doc, g, top, bottom) {
  const p = g.plan, ia = g.fuente === AI_MODEL;
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.8);
  const tl = doc.splitTextToSize(safe(p.explicacion), 166).slice(0, 14);
  const textH = 7 + 5 + 4.5 + 5 + tl.length * 4.1 + 5;
  const maxH = Math.min(bottom - top - textH, 150), maxW = 175;
  let h = maxH, w = h / g.ratio; if (w > maxW) { w = maxW; h = w * g.ratio; }
  doc.addImage(g.data, "JPEG", (210 - w) / 2, top, w, h);
  let y = top + h + 6.5;
  doc.setTextColor(0); doc.setFont("courier", "bold"); doc.setFontSize(12);
  doc.text(one(doc, safe(p.titulo).toUpperCase(), 175), 105, y, { align: "center" }); y += 5;
  doc.setFont("courier", "normal"); doc.setFontSize(7);
  doc.text(one(doc, safe(`${GL[p.genero]} · composición ${p.composicion} · luz ${p.luz} · clave ${p.clave} · ref.: ${p.referencias.join(", ")}`).toUpperCase(), 180), 105, y, { align: "center" }); y += 5.5;
  doc.setFont("helvetica", "bold"); doc.setFontSize(8);
  doc.text(ia ? `EXPLICACIÓN DE LA IA (${AI_MODEL.toUpperCase()})` : "EXPLICACIÓN (ALGORITMO LOCAL)", 22, y); y += 4.6;
  doc.setFont("helvetica", "italic"); doc.setFontSize(8.8); doc.setTextColor(30);
  tl.forEach(l => { doc.text(l, 22, y); y += 4.1; });
  y += 1.5; doc.setTextColor(110); doc.setFont("courier", "normal"); doc.setFontSize(6.5);
  doc.text(`Obra única n.º ${g.id.slice(0, 16)} · semilla aleatoria de 128 bits`, 105, Math.min(y, bottom), { align: "center" });
  doc.setTextColor(0);
}

// Texto escrito por la IA: poesía (centrada), prosa o diálogo en cuadros. Si no entra, sigue en otra hoja (ctx.nextPage).
function drawTexto(doc, t, top, bottom, ctx) {
  const x0 = 22, W = 166, tipo = t.tipo;
  let y = top + 4, bot = bottom;
  const room = h => { if (y + h > bot) { const p = ctx.nextPage(); y = p.top; bot = p.bottom; } };

  // Pintura que acompaña al texto: más chica si el texto es largo, para que entre en la primera hoja
  if (t.img) {
    const est = t.texto.length > 450 ? 999 : 24 + (tipo === "haiku" ? 28 : 5.5 * t.texto.split("\n").length);
    const maxH = est === 999 ? 60 : Math.max(40, Math.min(100, bot - y - est - 8)), maxW = 150;
    let h = maxH, w = h / t.img.ratio; if (w > maxW) { w = maxW; h = w * t.img.ratio; }
    doc.addImage(t.img.data, "JPEG", (210 - w) / 2, y, w, h); y += h + 7;
  }
  doc.setTextColor(0); doc.setFont("courier", "bold"); doc.setFontSize(13);
  doc.splitTextToSize(safe(t.titulo).toUpperCase(), 170).slice(0, 2).forEach(l => { doc.text(l, 105, y, { align: "center" }); y += 6; });
  doc.setFont("courier", "normal"); doc.setFontSize(7.5);
  doc.text(one(doc, safe(`${tipoNombre(tipo)} · ${AI_MODEL}${t.meta ? " · " + t.meta : ""}`).toUpperCase(), 180), 105, y, { align: "center" }); y += 8;

  // Presentación de los participantes (quiénes son), antes del diálogo
  if (t.elenco && t.elenco.length) {
    doc.setFontSize(7.8);
    const items = t.elenco.map(e => {
      doc.setFont("helvetica", "bold"); const nm = safe(e.n).toUpperCase(), nw = doc.getTextWidth(nm + "  ");
      doc.setFont("helvetica", "normal"); return { nm, nw, dl: doc.splitTextToSize(safe(e.d), W - 6 - nw).slice(0, 2) };
    });
    const h = 6.2 + items.reduce((a, it) => a + it.dl.length * 3.9 + .8, 0) + 1.2;
    room(h + 4);
    doc.setDrawColor(150); doc.setLineWidth(.2); doc.roundedRect(x0 - 3, y, W + 6, h, 1.6, 1.6); doc.setDrawColor(0);
    let yy = y + 4.4; doc.setTextColor(60); doc.setFont("courier", "bold"); doc.setFontSize(7); doc.text("PARTICIPAN", x0, yy); yy += 4;
    doc.setTextColor(0);
    items.forEach(it => {
      doc.setFont("helvetica", "bold"); doc.setFontSize(7.8); doc.text(it.nm, x0, yy);
      doc.setFont("helvetica", "normal"); it.dl.forEach(l => { doc.text(l, x0 + it.nw, yy); yy += 3.9; }); yy += .8;
    });
    y += h + 4;
  }

  const lines = safe(t.texto).split("\n").map(l => l.replace(/\s+$/, ""));

  if (tipo === "dialogo") {
    doc.setFontSize(9.5);
    parseDialogo(safe(t.texto)).forEach(d => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
      const wl = doc.splitTextToSize(d.t, W - 4), h = (d.n ? 5.4 : 1.5) + wl.length * 4.4 + 2.6;
      room(h + 2.5);
      doc.setFillColor(242, 242, 242); doc.roundedRect(x0 - 3, y, W + 6, h, 1.6, 1.6, "F");
      let yy = y + 4.2; doc.setTextColor(0);
      if (d.n) { doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.text(d.n.toUpperCase(), x0, yy); yy += 5; }
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
      wl.forEach(l => { doc.text(l, x0 + 2, yy); yy += 4.4; });
      y += h + 2.5;
    });
  } else if (["haiku", "poema", "soneto", "limerick"].includes(tipo)) {
    const fs = { haiku: 17, limerick: 13, soneto: 11.5, poema: 11.5 }[tipo], lh = fs * .53, centered = tipo === "haiku" || tipo === "limerick";
    doc.setFont("times", "italic"); doc.setFontSize(fs);
    const wrapped = lines.flatMap(l => l ? doc.splitTextToSize(l, 178) : [""]);
    const bw = Math.max(...wrapped.map(l => doc.getTextWidth(l))), bx = Math.max(15, (210 - bw) / 2);
    wrapped.forEach(l => {
      if (!l) { y += lh * .6; return; }
      room(lh); doc.setFont("times", "italic"); doc.setFontSize(fs); doc.setTextColor(0);
      if (centered) doc.text(l, 105, y, { align: "center" }); else doc.text(l, bx, y);
      y += lh;
    });
  } else {
    // prosa: microrrelato, fábula, aforismos
    const gap = tipo === "aforismos" ? 4 : 2.2;
    doc.setFont("times", "normal"); doc.setFontSize(11.5);
    lines.filter(Boolean).forEach(par => {
      doc.setFont("times", "normal"); doc.setFontSize(11.5);
      doc.splitTextToSize(par, W).forEach(l => { room(5.2); doc.setFont("times", "normal"); doc.setFontSize(11.5); doc.setTextColor(0); doc.text(l, x0, y); y += 5.2; });
      y += gap;
    });
  }
  y += 3; room(4);
  doc.setTextColor(110); doc.setFont("courier", "normal"); doc.setFontSize(6.5);
  doc.text(`Generado automáticamente por (${AI_MODEL})`, 105, y, { align: "center" });
  doc.setTextColor(0);
}

// Dibujo en SVG: imagen + título + ficha + explicación de la IA
function drawDibujo(doc, d, top, bottom) {
  const ia = d.fuente === AI_MODEL;
  doc.setFont("helvetica", "italic"); doc.setFontSize(8.8);
  const tl = d.desc ? doc.splitTextToSize(safe(d.desc), 166).slice(0, 6) : [];
  const textH = 7 + 5 + 5.5 + (tl.length ? 4.6 + tl.length * 4.1 : 0) + 4;
  const maxH = Math.min(bottom - top - textH, 150), maxW = 175;
  let h = maxH, w = h / d.ratio; if (w > maxW) { w = maxW; h = w * d.ratio; }
  doc.addImage(d.data, "JPEG", (210 - w) / 2, top, w, h);
  let y = top + h + 6.5;
  doc.setTextColor(0); doc.setFont("courier", "bold"); doc.setFontSize(12);
  doc.text(one(doc, safe(d.titulo).toUpperCase(), 175), 105, y, { align: "center" }); y += 5;
  doc.setFont("courier", "normal"); doc.setFontSize(7);
  doc.text(one(doc, safe(`${d.nombre} · ${ia ? "dibujo en SVG escrito por " + AI_MODEL : "algoritmo local"}`).toUpperCase(), 180), 105, y, { align: "center" }); y += 5.5;
  if (tl.length) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    doc.text(ia ? `EXPLICACIÓN DE LA IA (${AI_MODEL.toUpperCase()})` : "NOTA", 22, y); y += 4.6;
    doc.setFont("helvetica", "italic"); doc.setFontSize(8.8); doc.setTextColor(30);
    tl.forEach(l => { doc.text(l, 22, y); y += 4.1; });
  }
  doc.setTextColor(0);
}

/* ================== GENERAR PDF ================== */
async function generatePDF() {
  const com = COMISIONES[state.com];
  setBusy(true, "Preparando…"); setMsg("");
  try {
    if (!window.jspdf || typeof qrcode === "undefined") throw new Error("Las librerías todavía no cargaron. Probá de nuevo en unos segundos.");

    // 1) Contenido (lo único que usa red)
    let content = null, warn = "";
    try {
      if (state.mode === "gen") { setBusy(true, "Esperando a la IA…"); content = { gen: await loadObra() }; }
      else if (state.mode === "texto") { setBusy(true, "Esperando a la IA…"); content = { txt: await loadTexto() }; }
      else if (state.mode === "dibujo") { setBusy(true, "Esperando a la IA…"); content = { dib: await loadDibujo() }; }
      else if (state.mode === "azar") { setBusy(true, "Buscando una obra…"); content = { art: await getRandomArt() }; }
      else if (state.mode === "propia") content = { art: await getOwnArt() };
      if (content && content.art) {
        content.art.img = await processImg(content.art.src);
        if (!content.art.img) { warn = "No se pudo cargar la imagen; el PDF salió sin la obra."; content = null; }
      }
    } catch (e) { warn = "No se pudo obtener el contenido (" + e.message + "). El PDF salió solo con el QR."; content = null; }

    // 2) Documento
    setBusy(true, "Armando PDF…");
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    doc.setProperties({ title: PDF_TITLE + " — " + com.nombre });

    const dv = $("dateInput").value;
    const d = dv ? new Date(dv + "T12:00:00") : new Date(), now = new Date();
    const dateStr = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    const genStr = `Generado: ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

    drawHeader(doc, com.nombre, dateStr);
    const compact = !!(content && (content.gen || content.dib || (content.txt && content.txt.texto.length > 450)));
    if (compact) drawAttendanceQRCompact(doc, com.url, genStr); else drawAttendanceQR(doc, com.url, genStr);

    const top = compact ? 83 : 127, bottom = com.wa ? 248 : 287;
    const nextPage = () => { doc.addPage(); drawHeader(doc, com.nombre, dateStr); return { top: 38, bottom: 285 }; };
    if (content && content.gen) drawGen(doc, content.gen, top, bottom);
    else if (content && content.dib) drawDibujo(doc, content.dib, top, bottom);
    else if (content && content.txt) drawTexto(doc, content.txt, top, bottom, { nextPage });
    else if (content && content.art) drawArt(doc, content.art, top, bottom);

    if (com.wa) { doc.setPage(1); drawWA(doc, com.wa, com.nombre); }

    // Numeración de páginas (solo si el debate ocupó más de una hoja)
    const np = doc.getNumberOfPages();
    if (np > 1) for (let i = 1; i <= np; i++) {
      doc.setPage(i); doc.setTextColor(90); doc.setFont("courier", "normal"); doc.setFontSize(7);
      doc.text(`Pág. ${i}/${np}`, 195, 292, { align: "right" });
    }

    const clean = com.nombre.normalize("NFD").replace(/[̀-ͯ]/g, "");
    doc.save(`Asistencia_${clean}_${dateStr.replace(/\//g, "-")}.pdf`);

    if (content && content.gen) { state.obra = null; loadObra().catch(() => {}); } // deja listo el siguiente
    if (content && content.txt) { state.texto = null; loadTexto().catch(() => {}); }
    if (content && content.dib) { state.dib = null; loadDibujo().catch(() => {}); }
    setMsg(warn || "Listo ✓", !!warn);
  } catch (e) {
    console.error(e);
    setMsg("Error: " + e.message, true);
  } finally {
    setBusy(false);
  }
}
